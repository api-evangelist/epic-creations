name: Epic! Creations
description: >-
  Epic! Creations, Inc. operates Epic, an award-winning digital reading and
  learning platform for children twelve and under. The service gives families
  and educators unlimited access to a library of more than 40,000 books,
  audiobooks, and learning videos, with reading-level personalization, quizzes,
  and progress tracking. Epic offers a consumer family subscription and Epic
  School, a version that is free for teachers and students during the school
  day via class codes. The company was surfaced as a portfolio company of
  Battery Ventures and added to the API Evangelist network. Epic is a
  business-to-consumer application and does not publish a public developer
  program, API, or SDK surface.
